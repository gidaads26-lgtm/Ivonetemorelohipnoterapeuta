name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a pasta site com o endereço do GitHub Pages
        run: |
          mkdir -p _site
          cp -r site/. _site/
          sed -i 's#https://ivonetemorelohipnoterapeuta.vercel.app#https://gidaads26-lgtm.github.io/Ivonetemorelohipnoterapeuta#g' _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: publicacao
        uses: actions/deploy-pages@v4
